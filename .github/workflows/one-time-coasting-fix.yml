name: One-time coasting fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch shifter.cpp
        shell: pwsh
        run: |
          $path = "src/shifter.cpp"
          $text = [IO.File]::ReadAllText($path)

          $pattern = '(?s)\r?\n    bool coasting_downshift_eligible = false;.*?\r?\n    const bool can_downshift =.*?manual_brake_active\);\r?\n'
          $replacement = @'

    // Ordinary neutral coasting is not a reason to downshift. The old
    // coast-over-rev path could command 8 -> 7 at ~1200 RPM and then
    // repeatedly trigger load-downshift stabilization, defeating the
    // economy goal and delaying neutralization. Downshifts remain available
    // for genuine low-RPM/lugging conditions and manual braking.
    const bool can_downshift =
        (g > 1 && can_downshift_timing) &&
        (r <= effective_downshift_rpm ||
         is_lugging) &&
        (speed_loss_or_idle ||
         is_lugging ||
         manual_brake_active) &&
        !is_coasting;
'@

          $newText = [regex]::Replace($text, $pattern, $replacement, 1)
          if ($newText -eq $text) {
            throw "Expected coast-over-rev block was not found"
          }

          $newText = $newText.Replace("constexpr float DEFAULT_MAX_COAST_OVERREV_RPM = 2250.0f;`r`n`r`n", "")
          $newText = $newText.Replace("constexpr float DEFAULT_MAX_COAST_OVERREV_RPM = 2250.0f;`n`n", "")
          [IO.File]::WriteAllText($path, $newText, [Text.UTF8Encoding]::new($false))

      - name: Verify build
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Debug
          cmake --build build --config Release

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shifter.cpp
          git rm .github/workflows/one-time-coasting-fix.yml
          git commit -m "Fix coasting downshift behavior"
          git push
