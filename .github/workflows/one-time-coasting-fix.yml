name: One-time coasting fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch shifter.cpp
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/shifter.cpp")
          text = path.read_text(encoding="utf-8")

          old = '''    bool coasting_downshift_eligible = false;
    int block_target = g - 1;

    const int takeoff =
        std::clamp(config.takeoff_gear, 1, effective_max_gear);

    const float max_overrev_rpm =
        (context.rpm_limit > 1500.0f)
            ? (context.rpm_limit - 100.0f)
            : DEFAULT_MAX_COAST_OVERREV_RPM;

    if ((is_coasting || manual_brake_active) &&
        g > takeoff &&
        can_downshift_timing)
    {
        const int max_drop = std::min(3, g - takeoff);

        for (int d = max_drop; d >= 1; --d)
        {
            const int test_gear = g - d;

            const float landing_rpm =
                context.has_exact_ratios()
                    ? context.calculate_engine_rpm(test_gear, s)
                    : (r * (d == 3 ? 2.05f : (d == 2 ? 1.60f : 1.28f)));

            if (landing_rpm <= max_overrev_rpm &&
                (landing_rpm >= 1100.0f || s <= 5.0f))
            {
                block_target = test_gear;

                coasting_downshift_eligible =
                    (d >= 2) || (r <= effective_downshift_rpm);

                break;
            }
        }
    }

    const bool can_downshift =
        (g > 1 && can_downshift_timing) &&
        (coasting_downshift_eligible ||
         r <= effective_downshift_rpm ||
         is_lugging) &&
        (speed_loss_or_idle ||
         is_lugging ||
         is_coasting ||
         manual_brake_active);
'''

          new = '''    // Ordinary neutral coasting is not a reason to downshift. The old
    // coast-over-rev path could command 8 -> 7 at ~1200 RPM and then
    // repeatedly trigger load-downshift stabilization, defeating the
    // economy goal and delaying neutralization. Downshifts remain available
    // for genuine low-RPM/lugging conditions and manual braking.
    const bool can_downshift =
        (g > 1 && can_downshift_timing) &&
        (r <= effective_downshift_rpm ||
         is_lugging) &&
        (speed_loss_or_idle ||
         is_lugging ||
         manual_brake_active) &&
        !is_coasting;
'''

          if old not in text:
              raise SystemExit("Expected coast-over-rev block was not found; refusing to modify shifter.cpp")

          text = text.replace(old, new, 1)
          text = text.replace("constexpr float DEFAULT_MAX_COAST_OVERREV_RPM = 2250.0f;\n\n", "", 1)
          path.write_text(text, encoding="utf-8", newline="\n")

      - name: Verify build
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Debug
          cmake --build build --config Release

      - name: Commit patch and remove one-time workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shifter.cpp
          git rm .github/workflows/one-time-coasting-fix.yml
          git commit -m "Fix coasting downshift behavior"
          git push
