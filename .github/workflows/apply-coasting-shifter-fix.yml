name: Apply coasting shifter fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch shifter.cpp
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/shifter.cpp")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "constexpr float DEFAULT_MAX_COAST_OVERREV_RPM = 2250.0f;\n\n",
              "",
              1,
          )

          pattern = re.compile(
              r"    bool coasting_downshift_eligible = false;\n"
              r"    int block_target = g - 1;\n"
              r"\n"
              r"    const int takeoff =\n"
              r"        std::clamp\(config\.takeoff_gear, 1, effective_max_gear\);\n"
              r"\n"
              r"    const float max_overrev_rpm =\n"
              r"        \(context\.rpm_limit > 1500\.0f\)\n"
              r"            \? \(context\.rpm_limit - 100\.0f\)\n"
              r"            : DEFAULT_MAX_COAST_OVERREV_RPM;\n"
              r"\n"
              r"    if \(\(is_coasting \|\| manual_brake_active\) &&\n"
              r"        g > takeoff &&\n"
              r"        can_downshift_timing\)\n"
              r"    \{\n"
              r"        const int max_drop = std::min\(3, g - takeoff\);\n"
              r"\n"
              r"        for \(int d = max_drop; d >= 1; --d\)\n"
              r"        \{\n"
              r"            const int test_gear = g - d;\n"
              r"\n"
              r"            const float landing_rpm =\n"
              r"                context\.has_exact_ratios\(\)\n"
              r"                    \? context\.calculate_engine_rpm\(test_gear, s\)\n"
              r"                    : \(r \* \(d == 3 \? 2\.05f : \(d == 2 \? 1\.60f : 1\.28f\)\)\);\n"
              r"\n"
              r"            if \(landing_rpm <= max_overrev_rpm &&\n"
              r"                \(landing_rpm >= 1100\.0f \|\| s <= 5\.0f\)\)\n"
              r"            \{\n"
              r"                block_target = test_gear;\n"
              r"\n"
              r"                coasting_downshift_eligible =\n"
              r"                    \(d >= 2\) \|\| \(r <= effective_downshift_rpm\);\n"
              r"\n"
              r"                break;\n"
              r"            \}\n"
              r"        \}\n"
              r"    \}\n\n"
              r"    const bool can_downshift =\n"
              r"        \(g > 1 && can_downshift_timing\) &&\n"
              r"        \(coasting_downshift_eligible \|\|\n"
              r"         r <= effective_downshift_rpm \|\|\n"
              r"         is_lugging\) &&\n"
              r"        \(speed_loss_or_idle \|\|\n"
              r"         is_lugging \|\|\n"
              r"         is_coasting \|\|\n"
              r"         manual_brake_active\);\n"
          )

          replacement = '''    // Ordinary neutral coasting is not a reason to downshift. The previous
    // coast-over-rev path could command an unnecessary downshift at roughly
    // 1200 RPM, trigger load-downshift stabilization, and delay neutralization.
    // Keep downshifts for genuine low-RPM/lugging conditions or active braking.
    const bool can_downshift =
        (g > 1 && can_downshift_timing) &&
        (r <= effective_downshift_rpm ||
         is_lugging) &&
        (speed_loss_or_idle ||
         is_lugging ||
         manual_brake_active) &&
        !is_coasting;
'''

          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("Could not locate the old coast-over-rev block; no source changes made")

          old_required = "const unsigned required_stable = is_coasting ? 2 : 4;"
          text = text.replace(
              old_required,
              "const unsigned required_stable = 4;",
              1,
          )

          old_target = "multi_downshift_target_gear_ =\n                    (block_target < g - 1) ? block_target : 0;"
          if old_target in text:
              text = text.replace(
                  old_target,
                  "multi_downshift_target_gear_ = 0;",
                  1,
              )

          old_log = '''                    if (multi_downshift_target_gear_ > 0)
                    {
                        std::snprintf(
                            b,
                            sizeof(b),
                            "EcoDrive: COAST OVER-REV DOWN %d -> %d | target %d | RPM %.0f | Speed %.2f",
                            g,
                            g - 1,
                            multi_downshift_target_gear_,
                            r,
                            s);
                    }
                    else
                    {
                        std::snprintf(
                            b,
                            sizeof(b),
                            "EcoDrive: DOWN request %d -> %d | RPM %.0f | Speed %.2f%s",
                            g,
                            g - 1,
                            r,
                            s,
                            cruise ? " | cruise" : "");
                    }
'''
          new_log = '''                    std::snprintf(
                        b,
                        sizeof(b),
                        "EcoDrive: DOWN request %d -> %d | RPM %.0f | Speed %.2f%s",
                        g,
                        g - 1,
                        r,
                        s,
                        cruise ? " | cruise" : "");
'''
          if old_log in text:
              text = text.replace(old_log, new_log, 1)

          path.write_text(text, encoding="utf-8", newline="\n")

      - name: Build Debug and Release
        shell: powershell
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Debug
          cmake --build build --config Release

      - name: Commit source and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shifter.cpp
          git commit -m "Fix coasting downshift behavior"
          git push
