name: Build ETS2 Gearbox

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply coast downshift fix
        shell: pwsh
        run: |
          $path = "src/shifter.cpp"
          $text = Get-Content -Raw -Path $path

          $text = [regex]::Replace(
            $text,
            '(?m)^constexpr float DEFAULT_MAX_COAST_OVERREV_RPM = 2250\.0f;\r?\n',
            '')

          $text = $text.Replace(
            'if ((is_coasting || manual_brake_active) &&',
            'if (manual_brake_active &&')

          $text = [regex]::Replace(
            $text,
            'const bool can_downshift =\s*\(g > 1 && can_downshift_timing\) &&',
            "const bool can_downshift =`r`n        (g > 1 && can_downshift_timing) &&`r`n        !is_coasting &&")

          if ($text -notmatch 'const bool can_downshift =\s*\(g > 1 && can_downshift_timing\) &&\s*!is_coasting &&') {
            throw "Expected coast-downshift guard was not applied."
          }

          Set-Content -Path $path -Value $text -NoNewline

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shifter.cpp
          git diff --cached --exit-code
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No source changes needed."
            exit 0
          }
          git commit -m "Fix coast downshift behavior [skip ci]"
          git push

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build Debug
        run: cmake --build build --config Debug

      - name: Build Release
        run: cmake --build build --config Release
      - name: Upload Release DLL
        uses: actions/upload-artifact@v4
        with:
          name: ets2-gearbox-release
          path: build/Release/*.dll
