name: Build ETS2 Gearbox

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply coast downshift fix
        shell: pwsh
        run: |
          $path = "src/shifter.cpp"
          $text = Get-Content -Raw -Path $path

          $start = $text.IndexOf("    bool coasting_downshift_eligible = false;")
          $end = $text.IndexOf("    const bool can_downshift =", $start)
          if ($start -ge 0 -and $end -gt $start) {
            $text = $text.Remove($start, $end - $start)
          }

          $start = $text.IndexOf("    const bool can_downshift =")
          $end = $text.IndexOf("    if (can_downshift)", $start)
          if ($start -ge 0 -and $end -gt $start) {
            $replacement = @"
    const bool can_downshift =
        (g > 1 && can_downshift_timing) &&
        (r <= effective_downshift_rpm ||
         is_lugging) &&
        (speed_loss_or_idle ||
         is_lugging ||
         manual_brake_active) &&
        !is_coasting;

"@
            $text = $text.Remove($start, $end - $start).Insert($start, $replacement)
          }

          $text = $text.Replace(
            'multi_downshift_target_gear_ =\n                    (block_target < g - 1) ? block_target : 0;',
            'multi_downshift_target_gear_ = 0;')

          $text = $text.Replace(
            'const unsigned required_stable = is_coasting ? 2 : 4;',
            'const unsigned required_stable = 4;')

          if ($text -match 'DEFAULT_MAX_COAST_OVERREV_RPM|block_target|coasting_downshift_eligible') {
            throw "Obsolete coast over-rev logic remains in shifter.cpp."
          }

          if ($text -notmatch 'const bool can_downshift =\s*\(g > 1 && can_downshift_timing\) &&\s*\(r <= effective_downshift_rpm') {
            throw "Final downshift guard was not applied."
          }

          Set-Content -Path $path -Value $text -NoNewline

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shifter.cpp
          git diff --cached --exit-code
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No source changes needed."
            exit 0
          }
          git commit -m "Fix coast downshift behavior [skip ci]"
          git push

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build Debug
        run: cmake --build build --config Debug

      - name: Build Release
        run: cmake --build build --config Release
      - name: Upload Release DLL
        uses: actions/upload-artifact@v4
        with:
          name: ets2-gearbox-release
          path: build/Release/*.dll
