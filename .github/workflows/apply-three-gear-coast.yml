name: Apply three-gear coast change

on:
  push:
    branches:
      - coasting-restore-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coasting-restore-fix

      - name: Change coast drop from two gears to three
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/coasting_controller.cpp')
          s = p.read_text(encoding='utf-8')
          s = s.replace('constexpr int COASTING_GEAR_DROP = 2;', 'constexpr int COASTING_GEAR_DROP = 3;')
          s = s.replace('reaching its final two-gears-down target', 'reaching its final three-gears-down target')
          s = s.replace('12 -> 10 -> 8 -> 6 cascade', '12 -> 9 -> 6 -> 3 cascade')
          s = s.replace('(2 gears down, cruise %.2f m/s)', '(3 gears down, cruise %.2f m/s)')
          s = s.replace('(2 gears down)', '(3 gears down)')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit source change and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/coasting_controller.cpp
          git rm .github/workflows/apply-three-gear-coast.yml
          git commit -m "Make coasting drop three gears"
          git push origin coasting-restore-fix
