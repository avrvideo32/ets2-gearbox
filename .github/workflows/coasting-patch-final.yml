name: Coasting patch final
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch source
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/shifter.cpp')
          s = p.read_text(encoding='utf-8')
          s = s.replace('constexpr float DEFAULT_MAX_COAST_OVERREV_RPM = 2250.0f;\n\n', '', 1)
          start = s.index('    bool coasting_downshift_eligible = false;')
          end = s.index('    if (can_downshift)', start)
          new = '''    // Ordinary coasting is never a reason to downshift.
    // Keep downshifts for genuine low-RPM/lugging or active braking.
    const bool can_downshift =
        (g > 1 && can_downshift_timing) &&
        (r <= effective_downshift_rpm || is_lugging) &&
        (speed_loss_or_idle || is_lugging || manual_brake_active) &&
        !is_coasting;

'''
          s = s[:start] + new + s[end:]
          s = s.replace('const unsigned required_stable = is_coasting ? 2 : 4;', 'const unsigned required_stable = 4;', 1)
          s = s.replace('''                multi_downshift_target_gear_ =
                    (block_target < g - 1) ? block_target : 0;''', '''                multi_downshift_target_gear_ = 0;''', 1)
          marker = 'if (multi_downshift_target_gear_ > 0)'
          pos = s.find(marker)
          if pos >= 0:
              endlog = s.find('                    logger(b);', pos)
              if endlog >= 0:
                  close = s.rfind('                    }', pos, endlog)
                  if close >= 0:
                      s = s[:pos] + '''std::snprintf(
                        b,
                        sizeof(b),
                        "EcoDrive: DOWN request %d -> %d | RPM %.0f | Speed %.2f%s",
                        g,
                        g - 1,
                        r,
                        s,
                        cruise ? " | cruise" : "");

''' + s[endlog:]
          p.write_text(s, encoding='utf-8', newline='\n')
      - name: Build
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Debug
          cmake --build build --config Release
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/shifter.cpp
          git commit -m 'Fix coasting downshift behavior'
          git push
